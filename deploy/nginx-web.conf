# sat.makonbook.uz, dev.makonbook.uz and makonbook.uz — add to the edge nginx
# config (/opt/sat-makon/makonbook/nginx/default.conf, mounted into
# makonbook-nginx), following makonbook-api/deploy/nginx-api.conf.
#
# Three parts, added in order (DEPLOY.md):
#   PART 1 first, reload nginx, issue the certificates;
#   PART 2 only after the certificates exist — nginx refuses to load a server
#   block whose certificate file is missing, and that would take every site
#   on this edge down with it;
#   PART 3 when the landing page moves from dev.makonbook.uz to makonbook.uz:
#   it replaces the blocks of the site served there today.

# ---- PART 1: HTTP — ACME challenge for the certificates, redirect the rest ----
server {
    listen 80;
    server_name sat.makonbook.uz dev.makonbook.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- PART 2a: HTTPS sat.makonbook.uz — /v1/ to the API, the rest to the web container ----
server {
    listen 443 ssl;
    server_name sat.makonbook.uz;

    # Practice attempts and review logs are small JSON bodies.
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/sat.makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sat.makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Browsers use HTTPS only for this host from now on.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Variable upstreams, resolved per request, so nginx still starts (and
    # the other sites stay up) if a container is down.
    resolver 127.0.0.11 valid=30s;
    set $makonbook_api http://makonbook-api:8080;
    set $makonbook_web http://makonbook-web:8080;

    # The API, straight from the edge — not through the web container: the
    # API reads the LAST X-Forwarded-For entry (the one this nginx appends)
    # for its per-IP limits, and a second proxy would put the web container's
    # address there. Same headers as nginx-api.conf.
    location /v1/ {
        proxy_pass $makonbook_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass $makonbook_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# ---- PART 2b: HTTPS dev.makonbook.uz — the landing page, until it moves to makonbook.uz ----
server {
    listen 443 ssl;
    server_name dev.makonbook.uz;

    ssl_certificate /etc/letsencrypt/live/dev.makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s;
    set $makonbook_web http://makonbook-web:8080;

    location / {
        proxy_pass $makonbook_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

