# Added in every location that sets its own headers: nginx's add_header is
# not inherited into a block that has one of its own, so a Cache-Control in a
# location would otherwise drop these.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
