# The calculator frame (/calculator.html, app/src/calculator-frame.ts): Desmos
# runs here, framed by the app on the same origin. Its own headers replace the
# server's (nginx doesn't inherit add_header into a location that sets any):
# framing by our own pages only, and a policy that allows what Desmos needs —
# its scripts, fonts, images, workers and the code it compiles at run time
# ('unsafe-eval'). The app's own pages keep the strict policy (app-csp.conf).
# The same policy is app/csp.ts calculatorCsp(); `npm run check:csp` compares.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://www.desmos.com https://*.desmos.com; style-src 'self' 'unsafe-inline' https://www.desmos.com https://*.desmos.com; img-src 'self' data: blob: https:; font-src 'self' data: https://www.desmos.com https://*.desmos.com; connect-src 'self' https://www.desmos.com https://*.desmos.com; worker-src 'self' blob: https://www.desmos.com https://*.desmos.com; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Cache-Control "no-cache" always;
