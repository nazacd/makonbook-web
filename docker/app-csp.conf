# The app's Content-Security-Policy. The same policy as app/csp.ts (the dev and
# preview servers); keep the two in step. See that file for why each source.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.desmos.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https://www.desmos.com; connect-src 'self' https://www.desmos.com; worker-src 'self' blob:; frame-src https://www.desmos.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
