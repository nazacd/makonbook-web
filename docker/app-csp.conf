# The app's Content-Security-Policy. The same policy as app/csp.ts csp() (the dev
# and preview servers); keep the two in step. See that file for why each source.
# The calculator frame has its own: calculator-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
