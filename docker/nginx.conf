# nazacd/makonbook-web: one container, two sites, chosen by Host. The edge
# nginx (deploy/nginx-web.conf) terminates TLS and proxies here on 8080; the
# app's /v1/ never reaches this container (the edge sends it to the API).
#
# Base image: nginxinc/nginx-unprivileged (pid and temp files under /tmp, so
# the container runs read-only with a tmpfs on /tmp). This file replaces its
# /etc/nginx/conf.d/default.conf; the rest of its configuration is the
# image's own.

# Hashed assets (Vite: /assets/<name>-<hash>.*; the landing's /vendor/ files
# carry their version in the name) can be cached for a year; HTML never.
map $uri $mb_cache {
    default                      "public, max-age=3600";
    ~^/(assets|vendor)/          "public, max-age=31536000, immutable";
    ~\.html$                     "no-cache";
    /                            "no-cache";
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
# Serve the .gz files the build wrote (scripts/precompress.mjs) when there is one.
gzip_static on;

# Nothing the edge doesn't name: the healthcheck, and 404 for the rest.
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# ---- makonbook.uz: the landing page (dev.makonbook.uz until it moves) ----
server {
    listen 8080;
    server_name makonbook.uz dev.makonbook.uz;
    root /srv/landing;

    include /etc/nginx/mb/security-headers.conf;
    # The page's scripts and styles are its own files (no inline code); the
    # fonts come from Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $mb_cache always;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name www.makonbook.uz;
    return 301 https://makonbook.uz$request_uri;
}

# ---- sat.makonbook.uz: the app, a single-page application ----
server {
    listen 8080;
    server_name sat.makonbook.uz;
    root /srv/app;

    include /etc/nginx/mb/security-headers.conf;
    include /etc/nginx/mb/app-csp.conf;
    add_header Cache-Control $mb_cache always;

    # Hashed assets: exist or 404, never the page.
    location /assets/ {
        try_files $uri =404;
    }

    # Every other path is a route of the app: the page, and the router decides.
    location / {
        try_files $uri /index.html;
    }
}
